[project]
name = "lincs-processing"
version = "0.2.0"
description = "Helpers for filtering and reshaping LINCS L1000 gene-expression data."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hosein Fooladi", email = "fooladi.hosein@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3",
    "numpy>=1.24,<3",
    "tqdm>=4.60",
    "cmapPy>=4.0.1",
]

[project.scripts]
lincs-filter = "lincs_processing.filtering:main"

[project.urls]
Homepage = "https://github.com/HFooladi/lincs_processing"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lincs_processing"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "serial",
]

[tool.mypy]
ignore_missing_imports = true
